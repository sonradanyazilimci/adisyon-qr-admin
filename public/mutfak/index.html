<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mutfak Ekranı</title>
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#1c2530" />
<link rel="icon" href="../shared/icon.svg" />
<link rel="apple-touch-icon" href="../shared/icon.svg" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="stylesheet" href="../shared/common.css" />
<link rel="stylesheet" href="./css/mutfak.css" />
<!-- Tema sınıfını ilk boyamadan ÖNCE ata (beyaz parlaması olmasın). Mutfak
     varsayılanı koyu; kayıtlı tercih varsa o kullanılır. -->
<script>document.documentElement.setAttribute("data-tema", localStorage.getItem("tema") || "karanlik");</script>
</head>
<body>
  <div id="yukleniyor-ekrani" class="yukleniyor" style="min-height:100vh;">Yükleniyor...</div>

  <div id="sayfa" hidden>
    <header class="mod-header">
      <div class="mod-kimlik">
        <span class="mod-ikon">🍳</span>
        <div class="mod-kimlik-metin">
          <div class="mod-kimlik-ad">
            <strong id="mutfak-baslik">Mutfak</strong>
            <span class="gorev-rozet" id="mutfak-gorev">Mutfak</span>
          </div>
          <p class="mod-sube" id="mutfak-alt-baslik">Şube</p>
        </div>
      </div>
      <div class="mod-eylemler">
        <button id="tema-degistir-buton" class="tema-degistir-buton" title="Tema değiştir">☀️</button>
        <button id="cikis-buton" class="btn-ikincil btn-kucuk">Çıkış</button>
      </div>
    </header>

    <main class="mutfak-govde">
      <section class="mutfak-sutun">
        <h2>🆕 Sipariş Geldi <span id="yeni-sayisi" class="sayac"></span></h2>
        <div id="yeni-liste" class="siparis-kart-liste"></div>
      </section>
      <section class="mutfak-sutun">
        <h2>🔥 Hazırlanıyor <span id="hazirlaniyor-sayisi" class="sayac"></span></h2>
        <div id="hazirlaniyor-liste" class="siparis-kart-liste"></div>
      </section>
      <section class="mutfak-sutun">
        <h2>✅ Hazırlandı <span id="hazir-sayisi" class="sayac"></span></h2>
        <div id="hazir-liste" class="siparis-kart-liste"></div>
      </section>
    </main>
  </div>

  <script type="module" src="./js/mutfak.js"></script>
</body>
</html>
