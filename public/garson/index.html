<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Garson Terminali</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&display=swap" />
<link rel="stylesheet" href="../shared/common.css" />
<link rel="stylesheet" href="../menu/css/menu.css" />
<link rel="stylesheet" href="./css/garson.css" />
</head>
<body>
  <div id="yukleniyor-ekrani" class="yukleniyor" style="min-height:100vh;">Yükleniyor...</div>

  <div id="sayfa" hidden>
    <header class="garson-header">
      <div>
        <h1 id="garson-baslik">Garson Terminali</h1>
        <p id="garson-alt-baslik">Şube</p>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <button id="tema-degistir-buton" class="tema-degistir-buton" title="Tema değiştir">🌙</button>
        <button id="cikis-buton" class="btn-ikincil btn-kucuk">Çıkış</button>
      </div>
    </header>

    <section class="masa-secim-alani">
      <h2>Masalar</h2>
      <div id="masalar-grid" class="masalar-grid"></div>
    </section>

    <section id="siparis-alani" class="siparis-alani" hidden>
      <div class="siparis-alani-baslik">
        <h2 id="secili-masa-baslik">Masa</h2>
        <button id="masa-kapat-buton" class="btn-ikincil btn-kucuk">← Masalara Dön</button>
      </div>
      <div id="mevcut-siparisler" class="mevcut-siparisler"></div>
      <h3 class="menu-alt-baslik">Ürün Ekle</h3>
      <div class="arama-alani" style="padding:0 0 10px;"><input id="arama-input" type="search" placeholder="Menüde ara..." /></div>
      <nav id="kategori-seritler" class="kategori-seritler" style="padding:4px 0 12px;"></nav>
      <main id="urun-listesi" class="urun-listesi urun-kare-grid" style="padding:0;"></main>
    </section>

    <button id="sepet-bar" class="sepet-bar" hidden>
      <span id="sepet-bar-adet">0 ürün</span>
      <span id="sepet-bar-tutar">0,00 ₺</span>
      <span class="sepet-bar-ok">Sepeti Gör →</span>
    </button>
  </div>

  <script type="module" src="./js/garson.js"></script>
</body>
</html>
