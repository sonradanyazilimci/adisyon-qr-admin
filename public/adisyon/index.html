<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Adisyon / Kasa</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&display=swap" />
<link rel="stylesheet" href="../shared/common.css" />
<link rel="stylesheet" href="../menu/css/menu.css" />
<link rel="stylesheet" href="./css/adisyon.css" />
</head>
<body>
  <div id="yukleniyor-ekrani" class="yukleniyor" style="min-height:100vh;">Yükleniyor...</div>

  <div id="sayfa" hidden class="sayfa-duzen">
    <header class="adisyon-header yazdirma-gizle">
      <div>
        <h1 id="kasa-baslik">Adisyon / Kasa</h1>
        <p id="kasa-alt-baslik">Şube</p>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <button id="tema-degistir-buton" class="tema-degistir-buton" title="Tema değiştir">🌙</button>
        <button id="cikis-buton" class="btn-ikincil btn-kucuk">Çıkış</button>
      </div>
    </header>

    <main class="adisyon-govde yazdirma-gizle">
      <section class="masalar-panel">
        <h2>Masalar</h2>
        <div id="eylem-modu-banner" class="eylem-modu-banner" hidden></div>
        <div id="masalar-grid" class="masalar-grid"></div>
      </section>

      <section id="detay-panel" class="detay-panel">
        <div class="bos-durum">Detaylarını görmek için bir masa seçin.</div>
      </section>
    </main>

    <button id="sepet-bar" class="sepet-bar yazdirma-gizle" hidden>
      <span id="sepet-bar-adet">0 ürün</span>
      <span id="sepet-bar-tutar">0,00 ₺</span>
      <span class="sepet-bar-ok">Sepeti Gör →</span>
    </button>
  </div>

  <div id="fis-yazdirma" class="yazdirilacak" style="display:none;"></div>

  <script type="module" src="./js/adisyon.js"></script>
</body>
</html>
