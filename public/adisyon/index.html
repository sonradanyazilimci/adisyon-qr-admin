<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Adisyon / Kasa</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&display=swap" />
<link rel="stylesheet" href="../shared/common.css" />
<link rel="stylesheet" href="../menu/css/menu.css" />
<link rel="stylesheet" href="./css/adisyon.css" />
</head>
<body>
  <div id="yukleniyor-ekrani" class="yukleniyor" style="min-height:100vh;">Yükleniyor...</div>

  <div id="sayfa" hidden class="sayfa-duzen">
    <header class="adisyon-header yazdirma-gizle">
      <div>
        <h1 id="kasa-baslik">Adisyon / Kasa</h1>
        <p id="kasa-alt-baslik">Şube</p>
      </div>
      <div class="adisyon-ust-eylemler">
        <button id="gun-sonu-goster-buton" class="btn-birincil btn-kucuk">🌙 Gün Sonu</button>
        <button id="tema-degistir-buton" class="tema-degistir-buton" title="Tema değiştir">🌙</button>
        <button id="cikis-buton" class="btn-ikincil btn-kucuk">Çıkış</button>
      </div>
    </header>

    <nav class="adisyon-sekme-cubugu yazdirma-gizle">
      <button class="adisyon-sekme-buton aktif" data-sekme="masalar">🍽️ Masalar</button>
      <button class="adisyon-sekme-buton" data-sekme="puantaj">🕐 Puantaj</button>
      <button class="adisyon-sekme-buton" data-sekme="kasahareket">💰 Kasa Hareketleri</button>
    </nav>

    <section id="adisyon-sekme-masalar" class="adisyon-sekme-icerik">
      <main class="adisyon-govde yazdirma-gizle">
        <section class="masalar-panel">
          <div class="masalar-panel-baslik">
            <h2>Masalar</h2>
            <button id="garson-atama-goster-buton" class="btn-ikincil btn-kucuk">👥 Garson Ata</button>
          </div>
          <div id="garson-atama-paneli" class="garson-atama-paneli" hidden>
            <p class="garson-atama-aciklama">Bir garson seçin, sonra atamak istediğiniz masalara art arda dokunun.</p>
            <div id="garson-atama-cipler" class="garson-atama-cipler"></div>
          </div>
          <div id="eylem-modu-banner" class="eylem-modu-banner" hidden></div>
          <div id="masalar-grid" class="masalar-grid"></div>
        </section>

        <section id="detay-panel" class="detay-panel">
          <div class="bos-durum">Detaylarını görmek için bir masa seçin.</div>
        </section>
      </main>
    </section>

    <section id="adisyon-sekme-puantaj" class="adisyon-sekme-icerik yazdirma-gizle" hidden>
      <div class="tam-genislik-panel">
        <div class="puantaj-panel-baslik">
          <h2>🕐 Personel Puantajı</h2>
          <div class="puantaj-tarih-secim">
            <input id="puantaj-tarih-input" type="date" />
            <button id="puantaj-bugun-buton" class="btn-ikincil btn-kucuk">Bugün</button>
            <button id="puantaj-manuel-ekle-buton" class="btn-birincil btn-kucuk">+ Manuel Kayıt</button>
          </div>
        </div>
        <div id="puantaj-listesi" class="liste-alani"></div>
      </div>
    </section>

    <section id="adisyon-sekme-kasahareket" class="adisyon-sekme-icerik yazdirma-gizle" hidden>
      <div class="tam-genislik-panel">
        <h2>💰 Kasa Hareketleri — Bu Vardiya</h2>
        <form id="kasa-hareket-form" class="kasa-hareket-form">
          <select name="tur" required>
            <option value="nakit_giris">⬆️ Nakit Giriş</option>
            <option value="nakit_cikis">⬇️ Nakit Çıkış</option>
          </select>
          <input name="tutar" type="number" step="0.01" min="0.01" placeholder="Tutar (₺)" required />
          <input name="aciklama" type="text" placeholder="Açıklama (örn: değişik para, gider vb.)" />
          <button type="submit" class="btn-birincil">Ekle</button>
        </form>
        <div id="kasa-hareket-listesi"></div>
      </div>
    </section>

    <button id="sepet-bar" class="sepet-bar yazdirma-gizle" hidden>
      <span id="sepet-bar-adet">0 ürün</span>
      <span id="sepet-bar-tutar">0,00 ₺</span>
      <span class="sepet-bar-ok">Sepeti Gör →</span>
    </button>
  </div>

  <div id="fis-yazdirma" class="yazdirilacak" style="display:none;"></div>

  <script type="module" src="./js/adisyon.js"></script>
</body>
</html>
